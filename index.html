<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexa Watch Demo</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Nexa Watch</h1>
    <p>Video Task Demo Platform</p>
</header>


<section class="hero">

<h2>Watch Videos & Track Your Progress</h2>

<p>
Complete demo tasks, check progress and manage your profile.
</p>

<div class="buttons">
<button onclick="showLogin()">Login</button>
<button onclick="showRegister()">Register Now</button>
</div>

</section>



<section class="card">

<h3>Demo Features</h3>

<ul>
<li>✅ Video Progress Tracking</li>
<li>✅ Balance Animation</li>
<li>✅ Completed Task Badge</li>
<li>✅ User Dashboard</li>
<li>✅ Task History</li>
</ul>

</section>



<div id="popup" class="popup">

<div class="box">

<h2 id="title">Login</h2>

<input type="text" placeholder="Username">

<input type="password" placeholder="Password">

<button>Continue</button>

<span onclick="closeBox()">Close</span>

</div>

</div>



<script src="script.js"></script>

</body>
</html>
