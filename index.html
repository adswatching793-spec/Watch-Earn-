<!DOCTYPE html>
<html>
<head>
<title>Nexa Watch</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#f3f4f6;
}

.header{
background:#111827;
color:white;
padding:25px;
text-align:center;
}

.header h1{
font-size:32px;
}

.hero{
text-align:center;
padding:50px 20px;
}

.hero h2{
font-size:30px;
margin-bottom:15px;
}

.hero p{
color:#555;
margin-bottom:25px;
}

button{
padding:14px 30px;
border:none;
border-radius:8px;
background:#2563eb;
color:white;
font-size:16px;
margin:8px;
cursor:pointer;
}

.card{
background:white;
width:90%;
max-width:500px;
margin:20px auto;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px #ddd;
}

.card h3{
margin-bottom:15px;
}

.card p{
padding:8px;
}

.login-box{
display:none;
background:white;
width:90%;
max-width:350px;
margin:20px auto;
padding:25px;
border-radius:15px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;
}

</style>

</head>

<body>

<div class="header">
<h1>Nexa Watch</h1>
<p>Professional Demo Platform</p>
</div>


<div class="hero">

<h2>Welcome To Nexa Watch</h2>

<p>
Track tasks, manage your profile and explore the dashboard.
</p>

<button onclick="showLogin()">Login</button>

<button onclick="showRegister()">Register Now</button>

</div>


<div class="card">

<h3>Dashboard Preview</h3>

<p>👤 User Profile</p>
<p>📺 Video Tasks</p>
<p>📊 Progress Tracking</p>
<p>✅ Completed Tasks</p>

<div class="login-box" id="box">

<h2 id="title">Register Now</h2>

<input type="text" placeholder="Full Name">

<input type="number" placeholder="WhatsApp Number">

<input type="password" placeholder="Password">

<input type="password" placeholder="Repeat Password">

<button>Register</button>

</div>

<script>

function showLogin(){
document.getElementById("box").style.display="block";
document.getElementById("title").innerHTML="Login";
}


function showRegister(){
document.getElementById("box").style.display="block";
document.getElementById("title").innerHTML="Register Now";
}

</script>


</body>
</html>
