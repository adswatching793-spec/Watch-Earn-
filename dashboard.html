<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexa Watch Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
background:#0b0f19;
display:flex;
align-items:center;
justify-content:center;
color:white;
}


.register-card{

width:90%;
max-width:400px;
background:#111827;
padding:35px;
border-radius:20px;
border:1px solid #273244;
box-shadow:0 10px 30px #000;

}


.logo{

text-align:center;
font-size:35px;
margin-bottom:10px;

}


h2{

text-align:center;
margin-bottom:25px;
font-size:30px;

}


input{

width:100%;
padding:15px;
margin:10px 0;
background:#1f2937;
border:none;
border-radius:10px;
color:white;
font-size:16px;

}


button{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
font-size:17px;
cursor:pointer;

}


p{

text-align:center;
margin-top:20px;
color:#9ca3af;

}


a{

color:#3b82f6;
text-decoration:none;

}


</style>

</head>


<body>


<div class="register-card">


<div class="logo">
Nexa Watch
</div>


<h2>Create Account</h2>


<input type="text" placeholder="Full Name">


<input type="number" placeholder="WhatsApp Number">


<input type="password" placeholder="Password">


<input type="password" placeholder="Repeat Password">



<button>
Register Now
</button>



<p>
Already have an account?
<a href="login.html">
Login
</a>
</p>


</div>


</body>
</html>
