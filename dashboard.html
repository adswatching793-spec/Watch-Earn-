<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexa Watch Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
linear-gradient(rgba(3,7,18,.9),rgba(3,7,18,.95)),
url("https://images.unsplash.com/photo-1611162617474-5b21e879e113");

background-size:cover;
background-position:center;
color:white;

}


.header{

background:rgba(17,24,39,.95);
padding:25px;
text-align:center;
border-bottom:1px solid #334155;

}


.header h1{

font-size:32px;

}


.container{

width:90%;
max-width:700px;
margin:25px auto;

}


.card{

background:rgba(17,24,39,.95);
padding:25px;
border-radius:20px;
margin-bottom:20px;
border:1px solid #334155;
box-shadow:0 10px 30px #000;

}


.balance{

font-size:38px;
color:#22c55e;
margin-top:15px;

}


.task{

background:#1e293b;
padding:18px;
border-radius:15px;
margin-top:15px;

}


.task button{

width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;

}


.progress{

height:12px;
background:#334155;
border-radius:20px;
overflow:hidden;

}


.progress span{

display:block;
height:100%;
width:60%;
background:#22c55e;

}


.menu{

display:flex;
justify-content:space-around;
margin-top:20px;

}


.menu div{

background:#1e293b;
padding:12px;
border-radius:10px;
font-size:14px;

}


</style>

</head>


<body>


<div class="header">

<h1>Nexa Watch</h1>

<p>Ads Watching Dashboard</p>

</div>



<div class="container">



<div class="card">

<h2>Welcome 👋</h2>

<p>User Account</p>

<h1 class="balance">
1000 PKR
</h1>

</div>



<div class="card">

<h2>Task Progress</h2>

<br>

<div class="progress">

<span></span>

</div>

<p style="margin-top:12px;">
6 Tasks Completed / 10
</p>

</div>



<div class="card">

<h2>Available Ads Tasks</h2>


<div class="task">

📺 Advertisement Task 01

<a href="task.html">
<button>
Start Watching
</button>
</a>

</div>



<div class="task">

📺 Advertisement Task 02

<button>
Start Watching
</button>

</div>



<div class="task">

📺 Advertisement Task 03

<button>
Start Watching
</button>

</div>



</div>



<div class="card">

<h2>Account Menu</h2>


<div class="menu">

<div>Profile</div>

<div>History</div>

<div>Support</div>

</div>


</div>



</div>


</body>

</html>
