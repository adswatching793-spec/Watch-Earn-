<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexa Watch Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0f19;
color:white;
}

.header{
background:#111827;
padding:25px;
text-align:center;
border-bottom:1px solid #334155;
}

.header h1{
font-size:32px;
}

.container{
width:90%;
max-width:700px;
margin:25px auto;
}

.card{
background:#111827;
padding:25px;
border-radius:20px;
margin-bottom:20px;
border:1px solid #334155;
}

.balance{
font-size:38px;
color:#22c55e;
margin-top:10px;
}

.stats{
display:flex;
gap:10px;
}

.stat{
flex:1;
background:#1e293b;
padding:15px;
border-radius:12px;
text-align:center;
}

.task{
background:#1e293b;
padding:18px;
border-radius:15px;
margin-top:15px;
}

button{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:16px;
}

.withdraw{
background:#16a34a;
}

</style>

</head>


<body>


<div class="header">

<h1>Nexa Watch</h1>

<p>Ads Watching Dashboard</p>

</div>



<div class="container">


<div class="card">

<h2>Welcome User 👋</h2>

<p>Account Overview</p>

<h1 class="balance">
1000 PKR
</h1>

</div>



<div class="card">

<h2>Task Statistics</h2>

<br>

<div class="stats">

<div class="stat">
<h3>10</h3>
<p>Total Tasks</p>
</div>


<div class="stat">
<h3>6</h3>
<p>Completed</p>
</div>

</div>

</div>



<div class="card">

<h2>Available Ads</h2>


<div class="task">

📺 Advertisement Task 01

<a href="task.html">
<button>
Start Watching
</button>
</a>

</div>


<div class="task">

📺 Advertisement Task 02

<a href="task.html">
<button>
Start Watching
</button>
</a>

</div>


<div class="task">

📺 Advertisement Task 03

<a href="task.html">
<button>
Start Watching
</button>
</a>

</div>


</div>



<div class="card">

<h2>Withdraw</h2>

<p>Manage your withdrawal request</p>

<button class="withdraw">
Withdraw Request
</button>

</div>



</div>


</body>

</html>
