<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexa Watch Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0f19;
color:white;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{

width:90%;
max-width:420px;
background:#111827;
padding:35px;
border-radius:20px;
border:1px solid #334155;
text-align:center;

}

.avatar{

width:90px;
height:90px;
border-radius:50%;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
margin:auto;
font-size:35px;

}

h2{
margin:20px 0;
}

.info{

background:#1e293b;
padding:15px;
border-radius:12px;
margin:10px 0;

}

button{

width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:12px;
background:#dc2626;
color:white;
font-size:16px;

}

a{
text-decoration:none;
color:white;
}

</style>

</head>


<body>


<div class="card">

<div class="avatar">
👤
</div>


<h2>User Profile</h2>


<div class="info">
Name: User
</div>


<div class="info">
WhatsApp: +92XXXXXXXXXX
</div>


<div class="info">
Account Status: Active
</div>


<a href="index.html">
<button>
Logout
</button>
</a>


</div>


</body>

</html>
