<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexa Watch Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
background:
linear-gradient(rgba(3,7,18,0.85),rgba(3,7,18,0.95)),
url("https://images.unsplash.com/photo-1611162618071-b39a2ec055fb");
background-size:cover;
background-position:center;
}


.card{

width:90%;
max-width:420px;
background:rgba(17,24,39,0.92);
padding:35px;
border-radius:22px;
border:1px solid #334155;
box-shadow:0 15px 40px #000;

}


.logo{

text-align:center;
font-size:34px;
font-weight:bold;
margin-bottom:8px;

}


.tagline{

text-align:center;
color:#94a3b8;
margin-bottom:25px;

}


h2{

text-align:center;
margin-bottom:25px;

}


input{

width:100%;
padding:15px;
margin:10px 0;
border-radius:12px;
border:none;
background:#1e293b;
color:white;
font-size:16px;

}


button{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:#16a34a;
color:white;
font-size:17px;

}


p{

text-align:center;
margin-top:20px;
color:#94a3b8;

}


a{

color:#3b82f6;
text-decoration:none;
font-weight:bold;

}


</style>

</head>


<body>


<div class="card">


<div class="logo">
Nexa Watch
</div>


<div class="tagline">
Create Your Account
</div>


<h2>
Register Now
</h2>


<input type="text" placeholder="Full Name">


<input type="number" placeholder="WhatsApp Number">


<input type="password" placeholder="Password">


<input type="password" placeholder="Repeat Password">


<button>
Create Account
</button>


<p>
Already have account?
<a href="login.html">
Login
</a>
</p>


</div>


</body>
</html>
