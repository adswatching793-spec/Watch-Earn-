<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexa Watch Task</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0f19;
color:white;
}

.header{
background:#111827;
padding:25px;
text-align:center;
}

.container{
width:90%;
max-width:450px;
margin:30px auto;
}

.card{
background:#111827;
padding:30px;
border-radius:20px;
border:1px solid #334155;
text-align:center;
}

.video{
height:220px;
background:#1e293b;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:65px;
margin:20px 0;
}

.timer{
font-size:35px;
color:#22c55e;
margin:15px;
}

.progress{
height:12px;
background:#334155;
border-radius:20px;
}

.progress span{
display:block;
height:100%;
width:70%;
background:#2563eb;
border-radius:20px;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:12px;
background:#16a34a;
color:white;
font-size:17px;
}

.badge{
display:none;
margin-top:15px;
color:#22c55e;
font-weight:bold;
}

</style>

</head>

<body>


<div class="header">

<h1>Nexa Watch</h1>

<p>Advertisement Task</p>

</div>


<div class="container">


<div class="card">


<h2>Video Task 01</h2>


<div class="video">
▶
</div>


<div class="timer" id="time">
30
</div>


<p>Watch Progress</p>

<br>

<div class="progress">
<span></span>
</div>


<button onclick="completeTask()">
Complete Task
</button>


<div class="badge" id="done">
✓ Task Completed
</div>


</div>

</div>



<script>

let time=30;

let counter=setInterval(function(){

time--;

document.getElementById("time").innerHTML=time;


if(time<=0){

clearInterval(counter);

document.getElementById("time").innerHTML="Ready";

}

},1000);



function completeTask(){

document.getElementById("done").style.display="block";

}

</script>


</body>

</html>
