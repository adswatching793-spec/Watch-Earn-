<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexa Watch Task</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0f19;
color:white;
min-height:100vh;
}


.header{
background:#111827;
padding:25px;
text-align:center;
border-bottom:1px solid #334155;
}


.container{
width:90%;
max-width:500px;
margin:30px auto;
}


.card{
background:#111827;
padding:30px;
border-radius:20px;
border:1px solid #334155;
text-align:center;
}


.video-box{

height:220px;
background:#1e293b;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:60px;
margin:20px 0;

}


button{

width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:17px;

}


.progress{

margin-top:20px;
height:12px;
background:#334155;
border-radius:20px;

}


.progress span{

display:block;
width:30%;
height:100%;
background:#22c55e;
border-radius:20px;

}

</style>

</head>


<body>


<div class="header">

<h1>Nexa Watch</h1>

<p>Advertisement Task</p>

</div>



<div class="container">


<div class="card">


<h2>Video Task 01</h2>


<div class="video-box">
▶
</div>


<p>Watch task progress</p>


<div class="progress">
<span></span>
</div>


<br>


<button>
Complete Task
</button>


</div>


</div>


</body>

</html>
