<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexa Watch Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
color:white;
background:
linear-gradient(rgba(3,7,18,0.85),rgba(3,7,18,0.95)),
url("https://images.unsplash.com/photo-1611162617474-5b21e879e113");
background-size:cover;
background-position:center;
}


.card{

width:90%;
max-width:420px;
background:rgba(17,24,39,0.92);
padding:35px;
border-radius:22px;
border:1px solid #334155;
box-shadow:0 15px 40px #000;

}


.logo{

text-align:center;
font-size:34px;
font-weight:bold;
margin-bottom:8px;

}


.tagline{

text-align:center;
color:#94a3b8;
margin-bottom:25px;

}


h2{

text-align:center;
margin-bottom:25px;

}


input{

width:100%;
padding:15px;
margin:10px 0;
border-radius:12px;
border:none;
background:#1e293b;
color:white;
font-size:16px;

}


button{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-size:17px;
cursor:pointer;

}


button:hover{

background:#1d4ed8;

}


p{

text-align:center;
margin-top:20px;
color:#94a3b8;

}


a{

color:#22c55e;
text-decoration:none;
font-weight:bold;

}


.features{

margin-top:25px;
background:#0f172a;
padding:15px;
border-radius:12px;
font-size:14px;

}


.features div{

padding:6px;

}

</style>

</head>

<body>


<div class="card">


<div class="logo">
Nexa Watch
</div>


<div class="tagline">
Ads Watching Platform
</div>


<h2>
Login Account
</h2>


<input type="number" placeholder="WhatsApp Number">


<input type="password" placeholder="Password">


<a href="dashboard.html">
<button>
Login
</button>
</a>



<p>
New user?
<a href="register.html">
Register Now
</a>
</p>


<div class="features">

<div>▶ Watch Tasks</div>
<div>📊 Track Progress</div>
<div>👤 Manage Account</div>

</div>


</div>


</body>
</html>
